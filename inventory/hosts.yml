---
# Inventory hostnames MUST be the FQDNs of the nodes.
# All groups point to the single all-in-one node by default (Server World's
# "dlp" node, renamed dlp.tekup.world). To split the deployment like the
# guide (network.*, node01.*, snode01-03.*, nfs.*), add hosts under
# host_vars/ and move them into the matching groups below.
all:
  children:
    controller:          # MariaDB, RabbitMQ, Memcached, Keystone, Glance, Nova API, Placement,
      hosts:             # Cinder API, Barbican, Manila API, Horizon
        dlp.tekup.world:
    network:             # neutron-server, OVN central, Heat, Designate+BIND9, Octavia (OVN),
      hosts:             # Gnocchi, Ceilometer central, CloudKitty
        dlp.tekup.world:
    compute:             # nova-compute, ovn-controller, OVN metadata agent, ceilometer-compute
      hosts:
        dlp.tekup.world:
    storage:             # cinder-volume (LVM/NFS), cinder-backup, manila-share
      hosts:
        dlp.tekup.world:
    swift_proxy:
      hosts:
        dlp.tekup.world:
    swift_storage:
      hosts:
        dlp.tekup.world:
    nfs:                 # NFS server for Cinder NFS backend + Cinder backups
      hosts:
        dlp.tekup.world:
