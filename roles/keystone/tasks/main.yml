---
# Server World (03) Configure Keystone #1 and (04) Configure Keystone #2.

- name: Keystone database
  ansible.builtin.include_role:
    name: os_common
    tasks_from: db.yml
  vars:
    db_names: [keystone]
    db_user: keystone
    db_password: "{{ vault_db_passwords.keystone }}"

- name: Install Keystone, Apache and the OpenStack clients
  ansible.builtin.apt:
    name: "{{ ['keystone', 'apache2', 'libapache2-mod-wsgi-py3', 'python3-oauth2client'] + openstack_clients }}"
    state: present

- name: Configure keystone.conf
  community.general.ini_file:
    path: /etc/keystone/keystone.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0640"
    owner: root
    group: keystone
  loop:
    - {section: cache, option: memcache_servers, value: "{{ memcached_servers }}"}
    - {section: database, option: connection, value: "mysql+pymysql://keystone:{{ vault_db_passwords.keystone }}@{{ controller_fqdn }}:3306/keystone"}
    - {section: token, option: provider, value: fernet}
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  notify: restart apache2

- name: keystone-manage db_sync
  ansible.builtin.include_role:
    name: os_common
    tasks_from: manage.yml
  vars:
    manage_user: keystone
    manage_cmds: ["keystone-manage db_sync"]

- name: Fernet keys (created once, on the first controller)
  ansible.builtin.command: keystone-manage fernet_setup --keystone-user keystone --keystone-group keystone
  args:
    creates: /etc/keystone/fernet-keys/0
  when: inventory_hostname == controller_host

- name: Credential keys (created once, on the first controller)
  ansible.builtin.command: keystone-manage credential_setup --keystone-user keystone --keystone-group keystone
  args:
    creates: /etc/keystone/credential-keys/0
  when: inventory_hostname == controller_host

- name: Same Fernet and credential keys on every controller (HA)
  when: ha_enabled | bool
  block:
    - name: List keys on the first controller
      ansible.builtin.find:
        paths: [/etc/keystone/fernet-keys, /etc/keystone/credential-keys]
      register: _ks_keys
      delegate_to: "{{ controller_host }}"
      run_once: true

    - name: Read keys from the first controller
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _ks_keys.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: _ks_key_data
      delegate_to: "{{ controller_host }}"
      run_once: true
      no_log: true

    - name: Key directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: keystone
        group: keystone
        mode: "0700"
      loop: [/etc/keystone/fernet-keys, /etc/keystone/credential-keys]

    - name: Copy keys to the other controllers
      ansible.builtin.copy:
        dest: "{{ item.source }}"
        content: "{{ item.content | b64decode }}"
        owner: keystone
        group: keystone
        mode: "0600"
      loop: "{{ _ks_key_data.results }}"
      loop_control:
        label: "{{ item.source }}"
      when: inventory_hostname != controller_host
      no_log: true
      notify: restart apache2

- name: Bootstrap Keystone (admin user, RegionOne, identity endpoints)
  ansible.builtin.command:
    argv:
      - keystone-manage
      - bootstrap
      - --bootstrap-password
      - "{{ vault_admin_password }}"
      - --bootstrap-admin-url
      - "{{ keystone_url }}"
      - --bootstrap-internal-url
      - "{{ keystone_url }}"
      - --bootstrap-public-url
      - "{{ keystone_url }}"
      - --bootstrap-region-id
      - "{{ region }}"
    creates: /etc/keystone/.ansible-bootstrapped
  no_log: true
  register: _ks_bootstrap
  run_once: true

- name: Mark Keystone as bootstrapped
  ansible.builtin.file:
    path: /etc/keystone/.ansible-bootstrapped
    state: touch
    mode: "0600"
  when: _ks_bootstrap is changed
  run_once: true

- name: Apache ServerName
  ansible.builtin.lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: '^ServerName\s'
    line: "ServerName {{ fqdn }}"
  notify: restart apache2

# mod_ssl must be on before the TLS vhost is written: the keystone package has
# already enabled its site, so Apache's config check would fail on SSLEngine.
- name: Enable mod_ssl and mod_wsgi
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
    ignore_configcheck: true
  loop: [ssl, wsgi]
  notify: restart apache2

- name: Keystone vhost on :5000 with TLS
  ansible.builtin.template:
    src: keystone-apache.conf.j2
    dest: /etc/apache2/sites-available/keystone.conf
    mode: "0644"
  notify: restart apache2

- name: Enable the keystone site
  ansible.builtin.command: a2ensite keystone
  args:
    creates: /etc/apache2/sites-enabled/keystone.conf
  notify: restart apache2

- name: Enable Apache
  ansible.builtin.systemd_service:
    name: apache2
    state: started
    enabled: true

- name: Restart Apache now
  ansible.builtin.meta: flush_handlers

- name: Publish Keystone on the VIP (TLS passthrough, Apache does TLS)
  ansible.builtin.include_role:
    name: os_common
    tasks_from: nginx_stream.yml
  vars:
    stream_name: keystone
    stream_ports: [5000]
    stream_mode: passthrough
  when: ha_enabled | bool

- name: Apply HAProxy changes
  ansible.builtin.meta: flush_handlers

- name: Wait for Keystone
  ansible.builtin.uri:
    url: "{{ keystone_url }}/v3"
    ca_path: "{{ tls_ca }}"
  register: _ks
  until: _ks.status == 200
  retries: 20
  delay: 3

- name: admin keystonerc (Server World 04)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/keystonerc.j2"
    dest: /root/keystonerc
    mode: "0600"
  vars:
    rc_project: admin
    rc_user: admin
    rc_password: "{{ vault_admin_password }}"

- name: Source keystonerc in root's .bashrc
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: "source ~/keystonerc"

- name: clouds.yaml directory
  ansible.builtin.file:
    path: /root/.config/openstack
    state: directory
    mode: "0700"

- name: clouds.yaml (admin, demo and swift clouds used by Ansible)
  ansible.builtin.template:
    src: clouds.yaml.j2
    dest: /root/.config/openstack/clouds.yaml
    mode: "0600"

- name: Role "service"
  openstack.cloud.identity_role:
    name: service
  run_once: true

- name: Project "service"
  openstack.cloud.project:
    name: service
    domain: default
    description: Service Project
  run_once: true
